[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rime-ice-dict-update"
version = "1.1.0"
description = "从 iDvel/rime-ice 上游更新本地 Rime 词库，支持安全的三方增量合并。Update your local Rime dictionaries from the rime-ice upstream with a safe 3-way incremental merge."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Ryekee" }]
keywords = ["rime", "rime-ice", "input-method", "dictionary", "cli", "squirrel"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

# Parse Rime YAML headers with a standard parser. Git is also required.
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ryekee/rime-ice-dict-update"
Repository = "https://github.com/ryekee/rime-ice-dict-update"
Issues = "https://github.com/ryekee/rime-ice-dict-update/issues"

[project.scripts]
rimeup = "rimeup:main"

[tool.setuptools]
py-modules = ["rimeup"]
